<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Recipin</title>
  <meta name="description" content="Recipin – כל המתכונים שלך במקום אחד" />
  <meta name="theme-color" content="#FFF8EE" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17110D" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preload" href="/fonts/fredoka-hebrew-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/assistant-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <script>try{var t=localStorage.getItem('recipin-theme');if(t&&t!=='terracotta')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip" href="#view">דלג לתוכן</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Recipin – לספר המתכונים">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="/icon.svg#pin" /></svg>
      <span class="brand-name">Recipin</span>
    </a>
    <nav class="topnav" id="topnav" aria-label="ניווט ראשי"></nav>
    <div class="top-cta" id="topCta"></div>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="ניווט ראשי"></nav>
  <div class="timers" id="timers" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <div id="cook" class="cook" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
